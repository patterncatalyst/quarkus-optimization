# ── Test profile ────────────────────────────────────────────
quarkus.log.file.enable=true
quarkus.log.file.path=logs/test.log
quarkus.log.file.level=DEBUG
quarkus.log.console.level=WARN

# ── Disable live reload in tests ───────────────────────────
quarkus.live-reload.enabled=false

# ── OpenTelemetry test exporter ────────────────────────────
quarkus.otel.exporter.otlp.endpoint=http://localhost:4318
quarkus.otel.sdk.disabled=true

# ── Micrometer (keep enabled for assertion tests) ──────────
quarkus.micrometer.enabled=true
