## ============================================================
## Demo 02: GC Monitoring — Quarkus 3.33.1 LTS / Java 25
## Extension: quarkus-micrometer-registry-prometheus + quarkus-opentelemetry
## Telemetry backend: Grafana LGTM (Tempo + Prometheus + Grafana)
## ============================================================

quarkus.application.name=quarkus-gc-monitoring-demo
quarkus.http.port=8080

## ── quarkus-micrometer-registry-prometheus ───────────────────────────
## Exposes /q/metrics for Prometheus scraping.

## Enable JVM binders for GC pause, heap, thread metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.vertx.enabled=true

## Histograms — enabled via MetricsConfig.java MeterFilter CDI bean
## (property-based distribution config is not recognized in Quarkus 3.33.1;
##  the MeterFilter approach is the officially supported method)

## ── OTel OTLP exporter → Grafana Tempo (replaces Jaeger) ─────────
## Single endpoint for traces AND metrics via OTLP gRPC
quarkus.otel.exporter.otlp.endpoint=http://grafana-lgtm:4317
quarkus.otel.traces.sampler=always_on
quarkus.otel.service.name=${quarkus.application.name}

## Metrics: Prometheus scrapes /q/metrics directly (no OTLP metrics export needed)

## ── Health (SmallRye Health) ───────────────────────────────
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.ui.enable=true

## ── Dev mode ──────────────────────────────────────────────
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%dev.quarkus.log.level=INFO

## OTel export timeout — prevents retry loop if Tempo not yet ready at boot
quarkus.otel.exporter.otlp.timeout=3s
