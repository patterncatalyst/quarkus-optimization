global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'latency-g1gc'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['app-g1gc:8080']
        labels:
          gc: 'G1GC'

  - job_name: 'latency-zgc'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['app-zgc:8080']
        labels:
          gc: 'ZGC'
